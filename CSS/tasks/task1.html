<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            display: flex;
            padding: 20px;
            border: 10px solid rgb(222, 167, 96);
            border-radius: 40px;
            height: 20vh;
            justify-content: center;
    
        }

        .box{
            padding: 60px;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">First box</div>
    </div>

    
</body>
</html>
