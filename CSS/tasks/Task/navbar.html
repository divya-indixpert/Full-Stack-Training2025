<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
</head>
<style>
    .navbar{
        border: 1px solid black;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }

    .menu{
        gap: 30px;
        display: flex;
        justify-content: center;
        justify-content: center;
    }

    

</style>

<body>
    <nav class="navbar">
        <div class="logo">LOGO</div>

        <ul class="menu">
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </nav>

</body>

</html>
