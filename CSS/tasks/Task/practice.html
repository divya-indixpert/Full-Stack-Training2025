<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        .navbar{
            border: 1px solid black;
            display: flex;
            justify-content: space-between;
           
        }

        .logo{
            display: flex;
            
        }
        .menu{
            display: flex;
            justify-content: center;
            padding-bottom: 20px;
         
           
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">LOGO</div>
        <div class="menu">MENU</div>
    </nav>

</body>

</html>
