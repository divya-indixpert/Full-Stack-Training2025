<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task2</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3,120px);
            gap: 10px;
            border: 2px solid blue;
            padding: 10px;
        }

        .box1{
            background-color: rgb(43, 90, 43);
            grid-column: 1 /4 ;
            grid-row: 1 / 3 ;
            border-radius: 10px;
            color: white;
            padding: 10px;
        }
        .box2{
            background-color: rgb(48, 9, 16);
            grid-column: 2 / 5;
            grid-row: 2 / 4;
            border-radius: 10px;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">One</div>
        <div class="box2">Two</div>
    </div>
    
    
</body>
</html>
