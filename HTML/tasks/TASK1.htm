<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Html Forms</title>
</head>
<body>
    <header>
        <h1>
            Html forms
        </h1>
    </header>

    <main>
        <form action="#" method="get">

            <div>
                <label></label>
                <input type="text" id="firstname" placeholder="firstname" minlength="3" maxlength="50" >
            </div>
            <div>
                <label></label>
                <input type="text" id="lastname" placeholder="lastname">
            </div>

            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                minlength="5" maxlength="15"
                pattern="[A-Za-z0-9]+">
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="6" maxlength="20" pattern="(?=.*/d)(?=*[a-z])(?=.*[A-Z])(?=.*@)">
            </div>

            <div>
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" pattern="[6-9]{1}[0-9]{9}">
            </div>

            <div>
                Gender:
                <label>
                <input type="radio" name="gender" value="male" required>
                </label>
                <label>
                <input type="radio" name="gender" value="female" required> 
                </label>
            </div>

            <div>
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>

            <div>
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="18" max="60">
            </div>

            <div>
                <label for="country">Country</label>
                <select id="country" name="country">
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
                <option value="Other">Other</option>
                </select>
            </div>

            <div>
                Skills:
                <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                <label><input type="checkbox" name="skills" value="JS"> JavaScript</label>
                <label><input type="checkbox" name="skills" value="React"> React </label>
                <label><input type="checkbox" name="skills" value="Node.js"> Node.js></label>
            </div>

            <div>
                <label for="website">Website</label>
                <input type="url" id="website" name="website">
            </div>

            <div>
                <label for="profile">Profile Picture</label>
                <input type="file" id="profile" name="profile" accept=".jpg,.png">
            </div>

            <div>
                <label for="about">About Yourself</label><br>
                <textarea id="about" name="about"></textarea>
            </div>

            <div>
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>

            </form>

    </main>
</body>
