<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event</title>
</head>

<body>

    <h1>Click Event</h1>
    <button id="btn">Click Me</button>

    <script>

        let button = document.querySelector("#btn");

        button.addEventListener("click", function () {
            console.log("button clicked")

        })

        



    </script>

</body>

</html>
