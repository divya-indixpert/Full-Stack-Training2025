<body>

    <script>

        let array = ['a', 'b', 'c', 'd'];

        function myMap(arr) {
            let Newarray = [];

            for (let i = 0; i < arr.length; i++) {
                Newarray.push(arr[i] + i);
            }

            return Newarray;
        }

        console.log(myMap(array));

    </script>
