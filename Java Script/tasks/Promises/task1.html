<body>

    <h1>Task Of Promises</h1>

    <script>
        let userPromise = new Promise(function(resolve,reject ){
            let dataAvilable = false;

            if (dataAvilable){
                resolve("User Data Recieved")

            } else {
                reject("User data not found");
            }
        });

        userPromise

        .then(function(result){
            console.log(result);
        })

        .catch(function(error){
            console.log(error);
        });

        
        
        
        
        
        
    </script>
    
</body>
